<script>
(function(){
  var KEY='desk-report-theme';
  function apply(mode){
    document.documentElement.classList.toggle('light', mode==='light');
    var b=document.getElementById('themeBtn');
    if(b) b.textContent = mode==='light' ? 'Dark mode' : 'Light mode';
    try { localStorage.setItem(KEY, mode); } catch (e) {}
  }
  var saved=null;
  try { saved=localStorage.getItem(KEY); } catch (e) {}
  apply(saved==='light'?'light':'dark');
  window.toggleDeskTheme=function(){
    apply(document.documentElement.classList.contains('light')?'dark':'light');
  };
})();
</script>
<script>
(function(){
  function norm(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  }
  var form=document.getElementById('playerSearchForm');
  var inp=document.getElementById('playerSearch');
  if(form) form.addEventListener('submit', function(e){ e.preventDefault(); jump(); });
  function apply(){
    if(!inp) return;
    var q=norm(inp.value);
    var n=0;
    document.querySelectorAll('table tbody tr').forEach(function(tr){
      var hit=!q || norm(tr.textContent).indexOf(q)>=0;
      tr.hidden=!!(q && !hit);
      if(q && hit) n++;
    });
    document.querySelectorAll('.bat-card').forEach(function(el){
      var hit=!q || norm(el.textContent).indexOf(q)>=0;
      el.hidden=!!(q && !hit);
      if(q && hit) n++;
    });
    var hint=document.getElementById('playerSearchHint');
    if(hint) hint.textContent = q ? (n ? n+' name'+(n===1?'':'s') : 'No names') : '';
  }
  function jump(){
    apply();
    var first=document.querySelector('table tbody tr:not([hidden]), .bat-card:not([hidden])');
    if(first) first.scrollIntoView({block:'center'});
  }
  if(inp){ inp.addEventListener('input', apply); inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); jump(); }
  }); }
})();
</script>
<script>
(function(){
  function val(td){
    if(!td) return {n:false, v:null, s:''};
    var dn=td.getAttribute('data-n');
    if(dn!==null && dn!==''){
      var n=parseFloat(dn);
      if(!isNaN(n)) return {n:true, v:n, s:dn};
    }
    if(td.querySelector){
      if(td.querySelector('.tick.on')) return {n:true, v:1, s:'1'};
      if(td.querySelector('.tick')) return {n:true, v:0, s:'0'};
    }
    var t=(td.textContent||'').trim();
    if(!t || t==='—' || t==='-') return {n:false, v:null, s:''};
    var pct=t.match(/(-?\d+(?:\.\d+)?)%/);
    if(pct) return {n:true, v:parseFloat(pct[1]), s:t};
    var rec=t.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)/);
    if(rec){
      var den=parseFloat(rec[2]);
      if(den) return {n:true, v:parseFloat(rec[1])/den, s:t};
    }
    var raw=t.replace(/[$,×x]/g,'').replace(/,/g,'');
    if(/^-?\d+(\.\d+)?$/.test(raw)) return {n:true, v:parseFloat(raw), s:t};
    var d=Date.parse(t);
    if(!isNaN(d) && /[A-Za-z]{3,}/.test(t) && /\d{4}/.test(t)) return {n:true, v:d, s:t};
    return {n:false, v:t.toLowerCase(), s:t};
  }
  function sortTable(table, col, dir){
    var tb=table && table.tBodies[0];
    if(!tb) return;
    Array.prototype.forEach.call(table.querySelectorAll('th'), function(h){
      h.removeAttribute('data-dir');
    });
    var mark=table.querySelector('th[data-col="'+col+'"]');
    if(!mark){
      var row=table.querySelector('thead tr');
      if(row && row.children[col]) mark=row.children[col];
    }
    if(mark) mark.setAttribute('data-dir', dir);
    var rows=Array.prototype.slice.call(tb.rows);
    rows.sort(function(a,b){
      var A=val(a.cells[col]);
      var B=val(b.cells[col]);
      if(A.v===null && B.v===null) return 0;
      if(A.v===null) return 1;
      if(B.v===null) return -1;
      var cmp=0;
      if(A.n && B.n) cmp=A.v-B.v;
      else cmp=String(A.v).localeCompare(String(B.v));
      return dir==='asc' ? cmp : -cmp;
    });
    rows.forEach(function(r){ tb.appendChild(r); });
  }
  document.addEventListener('click', function(e){
    var th=e.target.closest('table.sortable th');
    if(!th || th.closest('tfoot')) return;
    var table=th.closest('table');
    if(!table) return;
    var raw=th.getAttribute('data-col');
    var col=raw===null ? Array.prototype.indexOf.call(th.parentNode.children, th) : parseInt(raw,10);
    if(isNaN(col) || col<0) return;
    var dir=th.getAttribute('data-dir')==='asc' ? 'desc' : 'asc';
    sortTable(table, col, dir);
  });
  document.querySelectorAll('table.sortable[data-default-sort]').forEach(function(table){
    var want=(table.getAttribute('data-default-sort')||'').toLowerCase();
    var ths=table.querySelectorAll('thead th');
    var idx=-1;
    for(var i=0;i<ths.length;i++){
      var t=(ths[i].textContent||'').trim().toLowerCase();
      if(t===want || t.indexOf(want)>=0 || want.indexOf(t)>=0){
        var raw=ths[i].getAttribute('data-col');
        idx=raw===null ? i : parseInt(raw,10);
        break;
      }
    }
    if(idx>=0) sortTable(table, idx, 'desc');
  });
})();
</script>
<script>
(function(){
  var KEY='desk-hub-rail';
  function paint(closed){
    document.documentElement.classList.toggle('rail-closed', closed);
    var b=document.getElementById('railToggle');
    if(!b) return;
    b.textContent = closed ? '\u203A' : '\u2039';
    b.setAttribute('aria-label', closed ? 'Show menu' : 'Hide menu');
  }
  document.documentElement.classList.remove('rail-closed');
  paint(false);
  window.toggleHubRail=function(){
    var closed=!document.documentElement.classList.contains('rail-closed');
    paint(closed);
    try { localStorage.setItem(KEY, closed ? 'closed' : 'open'); } catch (e) {}
  };
  setTimeout(function(){
    if(!document.documentElement.classList.contains('rail-closed'))
      window.toggleHubRail();
  }, 10000);
})();
</script>
