<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>
(function(){
  try {
    if(localStorage.getItem('desk-hub-theme')==='light')
      document.documentElement.classList.add('light');
    if(localStorage.getItem('desk-hub-rail')==='closed')
      document.documentElement.classList.add('rail-closed');
  } catch (e) {}
})();
</script>
<title>GAMBIT</title>
<style>
:root{--bg:#121820;--fg:#f3efe6;--rail:#1a2430cc;--rail-line:#2e3c4a;--muted:#c4c0b6;--pill:#243140;--pill-fg:#f0c674;--pill-line:#3d4d5c;--accent:#a85d22;--val:#e8b86d;--card:#1a2430e6;--card-line:#3d4d5c;--desk:#a85d22;}
html{color-scheme:dark;}
html.light{color-scheme:light;--bg:#f6f1e8;--fg:#1a1c20;--rail:#ebe4d6ee;--rail-line:#d4cbb8;--muted:#5c564c;--pill:#fffdf8;--pill-fg:#6b4a12;--pill-line:#c9beaa;--accent:#8a4b16;--val:#8a4b16;--card:#fffdf8ee;--card-line:#d4cbb8;--desk:#8a4b16;}
.page-mlb{--desk:#1f6feb;--accent:#1f6feb;}
.page-nfl{--desk:#d97706;--accent:#d97706;}
.page-nflshowdown{--desk:#d97706;--accent:#d97706;}
.page-cfb{--desk:#e11d48;--accent:#e11d48;}
.page-showdown{--desk:#be123c;--accent:#be123c;}
.page-classic{--desk:#e11d48;--accent:#e11d48;}
.page-horses{--desk:#15803d;--accent:#15803d;}.page-nfldesk{--desk:#d97706;--accent:#d97706;}.page-cfbdesk{--desk:#e11d48;--accent:#e11d48;}
html,body{margin:0;padding:0;background-color:var(--bg);color:var(--fg);font-family:Georgia,"Iowan Old Style",serif;}
body{background-image:linear-gradient(180deg,rgba(18,24,32,.86),rgba(12,16,22,.93)),url("./assets/desk-bg-hub.jpg");background-size:cover;background-attachment:fixed;background-position:center top;}
body.page-mlb{background-image:linear-gradient(180deg,rgba(18,24,32,.86),rgba(12,16,22,.93)),url("./assets/desk-bg-mlb.jpg");}
body.page-nfl,body.page-nflshowdown,body.page-nfldesk{background-image:linear-gradient(180deg,rgba(18,24,32,.86),rgba(12,16,22,.93)),url("./assets/desk-bg-nfl.jpg");}
body.page-cfb,body.page-showdown,body.page-classic,body.page-cfbdesk{background-image:linear-gradient(180deg,rgba(18,24,32,.86),rgba(12,16,22,.93)),url("./assets/desk-bg-cfb.jpg");}
html.light body{background-image:linear-gradient(180deg,rgba(246,241,232,.9),rgba(246,241,232,.94)),url("./assets/desk-bg-hub.jpg");}
html.light body.page-mlb{background-image:linear-gradient(180deg,rgba(246,241,232,.9),rgba(246,241,232,.94)),url("./assets/desk-bg-mlb.jpg");}
html.light body.page-nfl,html.light body.page-nflshowdown,html.light body.page-nfldesk{background-image:linear-gradient(180deg,rgba(246,241,232,.9),rgba(246,241,232,.94)),url("./assets/desk-bg-nfl.jpg");}
html.light body.page-cfb,html.light body.page-showdown,html.light body.page-classic,html.light body.page-cfbdesk{background-image:linear-gradient(180deg,rgba(246,241,232,.9),rgba(246,241,232,.94)),url("./assets/desk-bg-cfb.jpg");}
.shell{display:flex;min-height:100vh;}
.rail{width:14rem;flex:0 0 14rem;background:var(--rail);border-right:1px solid var(--rail-line);padding:1.1rem .8rem;position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:.4rem;backdrop-filter:blur(14px);}
.rail .brand{order:0;}
.rail a.pill.home{order:1;}
.rail > *:not(.brand):not(a.pill.home):not(button.theme){order:2;}
.brand{font-size:1.15rem;letter-spacing:.28em;font-weight:700;text-transform:uppercase;color:#e8b86d;margin:.15rem 0 .85rem;line-height:1;}
.rail-toggle{order:0;align-self:flex-end;width:1.9rem;height:1.9rem;border-radius:999px;border:1px solid var(--pill-line);background:var(--pill);color:var(--val);font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer;line-height:1;padding:0;}
html.rail-closed .rail{width:2.7rem;flex-basis:2.7rem;padding:.7rem .4rem;overflow:hidden;}
html.rail-closed .rail > *:not(.rail-toggle){display:none !important;}
html.rail-closed .rail .rail-toggle{display:block;align-self:center;}
body.page-hub main{max-width:64rem;padding-top:1.1rem;}
.hero-splash{position:relative;padding:0;overflow:hidden;border:1px solid rgba(232,184,109,.55);background:#07090d;box-shadow:0 0 0 1px rgba(56,120,220,.28),0 24px 60px rgba(0,0,0,.48);}
.hero-splash img{display:block;width:100%;height:auto;}
.hero-splash h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
html.light .hero-splash{box-shadow:0 18px 40px rgba(40,30,10,.16);}
.pill{display:block;border-radius:999px;padding:.55rem .75rem;background:var(--pill);color:var(--pill-fg);text-decoration:none;font-size:.82rem;font-weight:700;line-height:1.25;border:1px solid var(--pill-line);}
.pill.on{background:var(--desk);color:#fff;border-color:var(--desk);}
.pill.home{border-color:var(--val);}
.pill.lane-mlb{border-color:#1f6feb;color:#8ab4ff;}
.pill.lane-nfl{border-color:#d97706;color:#fbbf24;}
.pill.lane-nflshowdown{border-color:#d97706;color:#fbbf24;}
.pill.lane-cfb{border-color:#e11d48;color:#fb7185;}
.pill.lane-showdown{border-color:#be123c;color:#fb7185;}
.pill.lane-classic{border-color:#e11d48;color:#fb7185;}
.pill.lane-horses{border-color:#15803d;color:#4ade80;}
.pill.lane-mlb.on{background:#1f6feb;color:#fff;border-color:#1f6feb;}
.pill.lane-nfl.on{background:#d97706;color:#fff;border-color:#d97706;}
.pill.lane-nflshowdown.on{background:#d97706;color:#fff;border-color:#d97706;}
.pill.lane-cfb.on{background:#e11d48;color:#fff;border-color:#e11d48;}
.pill.lane-showdown.on{background:#be123c;color:#fff;border-color:#be123c;}
.pill.lane-classic.on{background:#e11d48;color:#fff;border-color:#e11d48;}
.pill.lane-horses.on{background:#15803d;color:#fff;border-color:#15803d;}
.search-form{margin:.35rem 0 .2rem;}
.search-form input{width:100%;box-sizing:border-box;border-radius:999px;border:1px solid var(--pill-line);background:#121820cc;color:var(--fg);padding:.45rem .7rem;font:inherit;font-size:.8rem;}
main{flex:1;padding:1.6rem 1.8rem 3rem;max-width:48rem;}
.hero{margin:0 0 1.5rem;padding:1.15rem 1.2rem 1.05rem;border:1px solid rgba(232,184,109,.22);border-radius:.9rem;background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(168,93,34,.18));box-shadow:0 12px 40px rgba(0,0,0,.28);}
.page-mlb .hero{border-color:rgba(31,111,235,.35);background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(31,111,235,.22));}
.page-nfl .hero,.page-nflshowdown .hero{border-color:rgba(217,119,6,.35);background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(217,119,6,.22));}
.page-cfb .hero{border-color:rgba(225,29,72,.35);background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(225,29,72,.22));}
.page-showdown .hero{border-color:rgba(190,18,60,.35);background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(190,18,60,.22));}
.page-classic .hero{border-color:rgba(225,29,72,.35);background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(225,29,72,.22));}
.page-horses .hero{border-color:rgba(21,128,61,.35);background:linear-gradient(135deg,rgba(26,36,48,.72),rgba(21,128,61,.22));}
h1{font-size:2.05rem;margin:.1rem 0 .35rem;letter-spacing:-.02em;}
.sub{color:var(--muted);margin:0;font-size:1.02rem;}
.desk{margin:0 0 2.1rem;padding-top:.2rem;}
.desk-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.45rem .75rem;margin:0 0 .7rem;padding-bottom:.55rem;border-bottom:2px solid var(--desk);}
.desk-head h2{margin:0;font-size:1.45rem;flex:1 1 12rem;}
.lede{margin:0;color:var(--muted);font-size:.92rem;flex:1 1 100%;}
.day{margin:0 0 1.15rem;}
.day h3{margin:0 0 .45rem;font-size:1.05rem;color:var(--muted);font-weight:700;}
.day h3 a.day-link{color:var(--fg);text-decoration:none;border-bottom:2px solid var(--desk);padding-bottom:.08rem;}
.day h3 a.day-link:hover,.day h3 a.day-link:focus{color:#fff;outline:none;}
.games{list-style:none;margin:0;padding:0;}
.games li{margin:0 0 .5rem;}
.games a{display:block;color:var(--fg);font-size:1.18rem;font-weight:700;text-decoration:none;padding:.7rem .9rem;background:var(--card);border:1px solid var(--card-line);border-left:5px solid var(--desk);border-radius:.7rem;}
.games a:hover,.games a:focus{border-color:var(--desk);color:#fff;outline:none;}
.games a .when{display:inline;font-weight:700;font-size:1.35rem;letter-spacing:.01em;color:var(--val);margin:0 0 0 .75rem;}
.games a:hover .when,.games a:focus .when,html.light .games a:hover .when,html.light .games a:focus .when{color:var(--val);}
.tools-head{font-size:1.48rem;margin:2.1rem 0 .65rem;letter-spacing:-.02em;font-weight:800;line-height:1.2;color:var(--fg);}
.tools-head.section-head{padding-bottom:.45rem;border-bottom:2px solid rgba(232,184,109,.38);}
html.light .tools-head.section-head{border-bottom-color:rgba(138,75,22,.28);}
.games-latest{margin:.15rem 0 1.5rem;}
.games-latest a{border-left-width:6px;font-size:1.22rem;}
.games-latest li.lane-mlb a{--desk:#1f6feb;border-left-color:#1f6feb;}
.games-latest li.lane-nfl a,.games-latest li.lane-nflshowdown a{--desk:#d97706;border-left-color:#d97706;}
.games-latest li.lane-cfb a,.games-latest li.lane-classic a{--desk:#e11d48;border-left-color:#e11d48;}
.games-latest li.lane-showdown a{--desk:#be123c;border-left-color:#be123c;}
.games-latest li.lane-horses a{--desk:#15803d;border-left-color:#15803d;}
.latest-empty{margin:.25rem 0 1.5rem;font-size:1.02rem;}
.tools{display:grid;gap:.75rem;margin-top:.4rem;}
.tool{display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem;align-items:center;background:var(--card);border:1px solid var(--card-line);border-left:5px solid var(--desk);border-radius:.8rem;padding:.95rem 1.05rem;text-decoration:none;color:inherit;box-shadow:0 8px 24px rgba(0,0,0,.22);}
.tool.lane-mlb{--desk:#1f6feb;}
.tool.lane-nfl{--desk:#d97706;}
.tool.lane-nflshowdown{--desk:#d97706;}
.tool.lane-cfb{--desk:#e11d48;}
.tool.lane-showdown{--desk:#be123c;}
.tool.lane-classic{--desk:#e11d48;}
.tool.lane-horses{--desk:#15803d;}
.tool:hover,.tool:focus{border-color:var(--desk);outline:none;transform:translateY(-1px);}
.tool .when{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.tool .game{grid-column:1;font-size:1.35rem;font-weight:700;}
.tool .rate{grid-column:1;font-size:.82rem;color:var(--val);}
.tool .go{grid-column:2;grid-row:1 / span 3;color:var(--desk);font-weight:700;}
.hide{display:none !important;}
html.light .pill.lane-mlb{color:#1558c0;}
html.light .pill.lane-nfl,html.light .pill.lane-nflshowdown{color:#b45309;}
html.light .pill.lane-cfb,html.light .pill.lane-classic{color:#be123c;}
html.light .pill.lane-horses{color:#166534;}
html.light .pill.lane-showdown{color:#9f1239;}
html.light .search-form input{background:#fffdf8cc;}
html.light .hero{background:linear-gradient(135deg,rgba(255,253,248,.9),rgba(168,93,34,.14));box-shadow:0 12px 40px rgba(90,70,40,.12);}
html.light .page-mlb .hero{background:linear-gradient(135deg,rgba(255,253,248,.9),rgba(31,111,235,.14));}
html.light .page-nfl .hero,html.light .page-nflshowdown .hero{background:linear-gradient(135deg,rgba(255,253,248,.9),rgba(217,119,6,.16));}
html.light .page-cfb .hero,html.light .page-classic .hero{background:linear-gradient(135deg,rgba(255,253,248,.9),rgba(225,29,72,.12));}
html.light .page-horses .hero{background:linear-gradient(135deg,rgba(255,253,248,.9),rgba(21,128,61,.14));}
html.light .page-showdown .hero{background:linear-gradient(135deg,rgba(255,253,248,.9),rgba(190,18,60,.12));}
html.light .day h3 a.day-link:hover,html.light .day h3 a.day-link:focus,html.light .games a:hover,html.light .games a:focus{color:var(--fg);}
button.theme{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--pill-line);border-radius:999px;padding:.5rem .75rem;text-align:left;}
button.theme:hover{background:var(--pill);}
.rail button.theme{order:1;}
@media (max-width:720px){
  body{background-attachment:scroll;}
  .shell{display:block;}
  .rail{width:auto;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--rail-line);}
  .brand{flex:1 1 100%;}
  .pill{flex:1 1 auto;}
  main{padding:1rem 1rem 2.5rem;}
}
</style>
</head>
<body class="page-hub">
<div class="shell">
<aside class="rail">
<button class="rail-toggle" type="button" id="railToggle" onclick="toggleHubRail()" aria-label="Hide menu">‹</button>
<p class="brand">GAMBIT</p>
<a class="pill home on" href="./hub.html">Home</a>
<a class="pill lane-nfl" href="./nfl-desk.html">NFL</a>
<a class="pill lane-cfb" href="./cfb-desk.html">CFB</a>
<a class="pill lane-horses" href="./horses.html">Horses</a>
<a class="pill" href="./results.html">Results</a>
<form class="search-form" id="playerSearchForm" action="#" role="search">
<input id="hubSearch" type="search" placeholder="Search a game or date" autocomplete="off"/>
</form>
<button class="theme" type="button" id="themeBtn" onclick="toggleHubTheme()">Light mode</button>
</aside>
<main id="top">
<div class="hero hero-splash"><img src="./assets/gambit-splash.jpg" alt=""/><h1>GAMBIT</h1></div>
<div class="tools" id="boards"><a class="tool lane-nfl" href="./nfl-desk.html"><span class="game">NFL</span><span class="go">Open</span></a>
<a class="tool lane-cfb" href="./cfb-desk.html"><span class="game">CFB</span><span class="go">Open</span></a>
<a class="tool lane-horses" href="./horses.html"><span class="game">Horses</span><span class="go">Open</span></a></div><h2 class="tools-head section-head" id="latest">Latest</h2><p class="lede latest-empty">Nothing upcoming right now.</p>
</main>
</div>
<script>
(function(){
  var KEY='desk-hub-theme';
  function apply(mode){
    document.documentElement.classList.toggle('light', mode==='light');
    var b=document.getElementById('themeBtn');
    if(b) b.textContent = mode==='light' ? 'Dark mode' : 'Light mode';
    try { localStorage.setItem(KEY, mode); } catch (e) {}
  }
  var saved=null;
  try { saved=localStorage.getItem(KEY); } catch (e) {}
  apply(saved==='light'?'light':'dark');
  window.toggleHubTheme=function(){
    apply(document.documentElement.classList.contains('light')?'dark':'light');
  };
})();
</script>
<script>
(function(){
  var KEY='desk-hub-rail';
  function paint(closed){
    document.documentElement.classList.toggle('rail-closed', closed);
    var b=document.getElementById('railToggle');
    if(!b) return;
    b.textContent = closed ? '›' : '‹';
    b.setAttribute('aria-label', closed ? 'Show menu' : 'Hide menu');
  }
  paint(document.documentElement.classList.contains('rail-closed'));
  window.toggleHubRail=function(){
    var closed=!document.documentElement.classList.contains('rail-closed');
    paint(closed);
    try { localStorage.setItem(KEY, closed ? 'closed' : 'open'); } catch (e) {}
  };
})();
</script>
<script>
(function(){
  var form=document.getElementById('playerSearchForm');
  var box=document.getElementById('hubSearch');
  if(!form||!box) return;
  form.addEventListener('submit', function(e){ e.preventDefault(); filter(); jump(); });
  box.addEventListener('input', filter);
  function hayOf(el){
    return (el.getAttribute('data-search')||el.textContent||'').toLowerCase();
  }
  function filter(){
    var q=(box.value||'').trim().toLowerCase();
    document.querySelectorAll('.day').forEach(function(day){
      var head=day.querySelector('h3');
      var games=day.querySelectorAll('.games a');
      var headHit=!!(head && hayOf(head).indexOf(q)>=0);
      var gameHit=false;
      games.forEach(function(link){
        var hit=!q || hayOf(link).indexOf(q)>=0;
        link.classList.toggle('hide', !hit);
        if(link.parentElement) link.parentElement.classList.toggle('hide', !hit);
        if(hit) gameHit=true;
      });
      var show=!q || headHit || gameHit;
      day.classList.toggle('hide', !show);
    });
    document.querySelectorAll('.desk').forEach(function(desk){
      var hasDay=desk.querySelector('.day');
      var any=desk.querySelector('.day:not(.hide)');
      desk.classList.toggle('hide', !!(q && hasDay && !any));
    });
    document.querySelectorAll('.tool').forEach(function(link){
      var hay=(link.textContent||'').toLowerCase();
      link.classList.toggle('hide', !!(q && hay.indexOf(q)<0));
    });
  }
  function jump(){
    var first=document.querySelector('.games a:not(.hide)');
    if(first) first.focus();
  }
})();
</script>
</body>
</html>
