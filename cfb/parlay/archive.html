<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CFB PARLAY — Past slates</title>
<style>
:root{--bg:#121820;--fg:#f3efe6;--rail:#1a2430;--rail-line:#2e3c4a;--muted:#c4c0b6;--pill:#243140;--pill-fg:#f0c674;--pill-line:#3d4d5c;--accent:#e11d48;--val:#e8b86d;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;}
.shell{display:flex;min-height:100vh;}
.rail{width:13.5rem;flex:0 0 13.5rem;background:var(--rail);border-right:1px solid var(--rail-line);padding:1rem .75rem;position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:.45rem;}
.brand{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin:0 0 .4rem;}
.pill{display:block;border-radius:999px;padding:.55rem .7rem;background:var(--pill);color:var(--pill-fg);text-decoration:none;font-size:.82rem;font-weight:700;line-height:1.25;border:1px solid var(--pill-line);}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent);}
main{flex:1;padding:1.25rem 1.5rem 2.5rem;max-width:40rem;}
a{color:var(--val);}
</style>
<script>
(function(){
  try {
    if(localStorage.getItem('desk-hub-rail')==='closed')
      document.documentElement.classList.add('rail-closed');
  } catch (e) {}
})();
</script>
<style>
</style>
<style>
.rail-head{display:flex;align-items:center;gap:.5rem;width:100%;margin:0 0 .85rem;flex:0 0 auto;}
.rail-head .brand{margin:0;flex:1;min-width:0;line-height:1.1;}
.rail-toggle{flex:0 0 auto;width:1.9rem;height:1.9rem;border-radius:999px;border:1px solid var(--pill-line);background:var(--pill);color:var(--val);font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer;line-height:1;padding:0;}
html.rail-closed .rail{width:2.7rem;flex-basis:2.7rem;padding:.7rem .4rem;overflow:hidden;align-items:flex-start;}
html.rail-closed .rail > *:not(.rail-head){display:none !important;}
html.rail-closed .rail .rail-head{margin:0;width:100%;}
html.rail-closed .rail .rail-head .brand{display:none;}
</style>
</head>
<body>
<div class="shell">
<aside class="rail">
<div class="rail-head">
<button class="rail-toggle" type="button" id="railToggle" onclick="toggleHubRail()" aria-label="Hide menu">‹</button>
<p class="brand">CFB PARLAY<br/>ARCHIVE</p>
<a class="pill home" href="/mlb-props/hub.html">Home</a>
<a class="pill" href="./">Today</a>
<a class="pill on" href="./archive.html">Past slates</a>
</aside>
<main>
<h1>Past slates</h1>
<p class="sub">One link per contest. Home is the newest file (2026-09-19).</p>
<ul>
<li><a href="./">Latest (2026-09-19)</a></li>
<li><a href="./2026-09-19.html">September 19, 2026</a></li>
</ul>
</main>
</div>
<script>
(function(){
  var KEY='desk-hub-rail';
  function paint(closed){
    document.documentElement.classList.toggle('rail-closed', closed);
    var b=document.getElementById('railToggle');
    if(!b) return;
    b.textContent = closed ? '\u203A' : '\u2039';
    b.setAttribute('aria-label', closed ? 'Show menu' : 'Hide menu');
  }
  paint(document.documentElement.classList.contains('rail-closed'));
  window.toggleHubRail=function(){
    var closed=!document.documentElement.classList.contains('rail-closed');
    paint(closed);
    try { localStorage.setItem(KEY, closed ? 'closed' : 'open'); } catch (e) {}
  };
})();
</script>
</body>
</html>
