<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MLB Props — Past slates</title>
<style>
:root{--bg:#161616;--fg:#f4f4f4;--rail:#262626;--rail-line:#393939;--muted:#c6c6c6;--hint:#8d8d8d;--pill:#393939;--pill-fg:#9ef0f0;--pill-line:#525252;--pill-hover:#4c4c4c;--accent:#007d79;--table:#262626;--cell:#525252;--th:#393939;--val:#3ddbd9;--h:#3ddbd9;}
html.light{--bg:#f2f4f8;--fg:#161616;--rail:#e0e5eb;--rail-line:#c1c7cd;--muted:#525252;--hint:#6f6f6f;--pill:#dde1e6;--pill-fg:#004144;--pill-line:#a2a9b0;--pill-hover:#c1c7cd;--accent:#007d79;--table:#ffffff;--cell:#c1c7cd;--th:#e0e5eb;--val:#005d5d;--h:#005d5d;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;}
.shell{display:flex;min-height:100vh;}
.rail{width:11.5rem;flex:0 0 11.5rem;background:var(--rail);border-right:1px solid var(--rail-line);padding:1rem .75rem;position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:.45rem;}
.brand{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin:0 0 .4rem;}
.pill{display:block;border-radius:999px;padding:.55rem .7rem;background:var(--pill);color:var(--pill-fg);text-decoration:none;font-size:.82rem;font-weight:700;line-height:1.2;border:1px solid var(--pill-line);}
.pill .when{display:block;font-weight:400;color:var(--muted);font-size:.7rem;margin-bottom:.1rem;}
.pill:hover{background:var(--pill-hover);}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.pill.on .when{color:#fff;}
button.theme{font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;background:transparent;color:var(--pill-fg);border:1px solid var(--pill-line);border-radius:.4rem;padding:.5rem .7rem;}
button.theme:hover{background:var(--pill-hover);}
main{flex:1;padding:1.25rem 1.5rem 2.5rem;max-width:40rem;}
h1{font-size:1.6rem;margin:0 0 .3rem;}
.sub{color:var(--muted);margin:0 0 1.2rem;}
ul{margin:.3rem 0 1rem;padding-left:1.2rem;}
li{margin:.45rem 0;}
a{color:var(--val);}
</style>
</head>
<body>
<div class="shell">
<aside class="rail">
<p class="brand">MLB PROPS<br/>ARCHIVE</p>
<a class="pill" href="./"><span class="when">latest</span>Today</a>
<a class="pill on" href="./archive.html"><span class="when">dates</span>Past slates</a>
<button class="theme" type="button" id="themeBtn" onclick="toggleDeskTheme()">Light mode</button>
</aside>
<main>
<h1>Past slates</h1>
<p class="sub">Hits + runs + RBIs. Home always shows the latest night.</p>
<ul>
<li><a href="./">Latest (September 11, 2026)</a></li>
<li><a href="./2026-09-11.html">September 11, 2026</a></li>
<li><a href="./2026-09-10.html">September 10, 2026</a></li>
<li><a href="./2026-09-09.html">September 9, 2026</a></li>
<li><a href="./2026-09-08.html">September 8, 2026</a></li>
<li><a href="./2026-09-07.html">September 7, 2026</a></li>
<li><a href="./2026-09-06.html">September 6, 2026</a></li>
</ul>
</main>
</div>
<script>
function toggleDeskTheme(){
  var on=document.documentElement.classList.toggle("light");
  try{localStorage.setItem("desk-report-theme",on?"light":"dark");}catch(e){}
  var b=document.getElementById("themeBtn");
  if(b) b.textContent=on?"Dark mode":"Light mode";
}
(function(){
  try{if(localStorage.getItem("desk-report-theme")==="light") document.documentElement.classList.add("light");}catch(e){}
  var b=document.getElementById("themeBtn");
  if(b) b.textContent=document.documentElement.classList.contains("light")?"Dark mode":"Light mode";
})();
</script>
</body>
</html>
